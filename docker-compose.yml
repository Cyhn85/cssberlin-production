# Legacy compose file kept only for reference.
# Use docker-compose.cloudflare.yml for active production deployments.
# This file still reflects the old certbot-based flow and should not be the default path.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cssberlin
      POSTGRES_USER: ${POSTGRES_USER:-cssberlin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cssberlin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-setup:
    build:
      context: .
      dockerfile: Dockerfile
      target: ops
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cssberlin}:${POSTGRES_PASSWORD}@postgres:5432/cssberlin?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-cssberlin}:${POSTGRES_PASSWORD}@postgres:5432/cssberlin?schema=public
      NODE_ENV: production
      RUN_DB_SEED: ${RUN_DB_SEED:-0}
    command:
      - /bin/sh
      - /app/ops/run-db-setup.sh

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cssberlin}:${POSTGRES_PASSWORD}@postgres:5432/cssberlin?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-cssberlin}:${POSTGRES_PASSWORD}@postgres:5432/cssberlin?schema=public
      PRISMA_QUERY_ENGINE_LIBRARY: /app/src/generated/prisma/libquery_engine-linux-musl-openssl-3.0.x.so.node
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://cssberlin.de}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://cssberlin.de}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@cssberlin.de}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      PUSHER_APP_ID: ${PUSHER_APP_ID:-}
      PUSHER_KEY: ${PUSHER_KEY:-}
      PUSHER_SECRET: ${PUSHER_SECRET:-}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER:-eu}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NODE_ENV: production
      # TATANGA -> cssberlin real product import bridge (POST /api/products/import)
      TATANGA_IMPORT_API_KEY: ${TATANGA_IMPORT_API_KEY:?Set TATANGA_IMPORT_API_KEY in .env}
      LOCAL_UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./uploads:/app/uploads

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 3s

  certbot:
    image: certbot/certbot
    depends_on:
      - nginx
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  certbot-etc:
  certbot-var:
  webroot: