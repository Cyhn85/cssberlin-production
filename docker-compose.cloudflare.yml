services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cssberlin}
      POSTGRES_USER: ${POSTGRES_USER:-cssberlin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cssberlin} -d ${POSTGRES_DB:-cssberlin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-setup:
    build:
      context: .
      dockerfile: Dockerfile
      target: ops
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cssberlin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cssberlin}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-cssberlin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cssberlin}?schema=public
      NODE_ENV: production
      RUN_DB_SEED: ${RUN_DB_SEED:-1}
    command:
      - /bin/sh
      - /app/ops/run-db-setup.sh

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cssberlin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cssberlin}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-cssberlin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cssberlin}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env.production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://cssberlin.de}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://cssberlin.de}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@cssberlin.de}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      PUSHER_APP_ID: ${PUSHER_APP_ID:-}
      PUSHER_KEY: ${PUSHER_KEY:-}
      PUSHER_SECRET: ${PUSHER_SECRET:-}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER:-eu}
      NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-eu}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health?ready=1').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.cloudflare-origin.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cloudflare-realip.conf:/etc/nginx/cloudflare-realip.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  pgdata: